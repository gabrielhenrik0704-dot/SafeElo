services:
  app:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      APP_BASE_URL: https://${DOMAIN:?Configure DOMAIN com um domínio real}
  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?Configure DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
