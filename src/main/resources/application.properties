spring.application.name=SafeElo
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:h2:file:./.local/db/safeelo;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.h2.console.enabled=false
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.max-http-form-post-size=32KB
spring.servlet.multipart.max-file-size=1KB
spring.servlet.multipart.max-request-size=1KB
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
safeelo.encryption-key=${SAFEELO_ENCRYPTION_KEY:}
safeelo.base-url=${APP_BASE_URL:http://localhost:8080}
safeelo.mail-from=${MAIL_FROM:}
logging.level.org.springframework.security=INFO
